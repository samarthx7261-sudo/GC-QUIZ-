<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gc quiz 😋</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #111111;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            position: relative;
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            flex: 1;
        }
        .emoji-title {
            font-size: 24px;
            display: inline-block;
            margin-left: 4px;
        }
        .back-btn {
            background: #f0f0f0;
            color: #333333;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            width: auto;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #333333;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 10px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #ffffff;
            color: #111111;
        }
        input:focus, textarea:focus {
            border-color: #0084ff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active {
            opacity: 0.8;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .scroll-area {
            max-height: 42vh;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 8px;
        }
        .member-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .member-input-row input {
            margin-bottom: 0;
        }
        .option-btn {
            background: #f5f5f7;
            color: #111111;
            border: 1px solid #e0e0e0;
            margin-bottom: 8px;
            text-align: left;
            font-weight: 500;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .option-btn:hover {
            background: #e8e8ed;
        }
        .score-card {
            background: #f9f9fb;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .score-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 500;
        }
        .view-ans-btn {
            background: #e0f0ff;
            color: #0084ff;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
            cursor: pointer;
            width: auto;
        }
        .ans-details {
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #dddddd;
            font-size: 12px;
            color: #444444;
        }
        .ans-details div {
            margin-bottom: 6px;
        }
        .pfp-avatar {
            font-size: 20px;
            margin-right: 8px;
            display: inline-block;
        }
        .custom-q-block {
            background: #fafafa;
            border: 1px solid #eaeaea;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .watermark {
            text-align: right;
            font-size: 11px;
            color: #888888;
            font-weight: 500;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Screen 1: Welcome / Registration -->
        <div id="screen-welcome" class="screen active">
            <div class="header-row">
                <h1>gc quiz <span class="emoji-title">😋</span></h1>
            </div>
            <label>Apna Naam:</label>
            <input type="text" id="userName" placeholder="Pehle apna naam likho...">
            
            <label>Apna IG/WhatsApp Nickname:</label>
            <input type="text" id="userNickname" placeholder="Jaise: @sam_7261...">

            <label>Total GC Members Count (Max 20):</label>
            <input type="number" id="memberCount" placeholder="Jaise: 5, 10, 20..." min="2" max="20">
            
            <button onclick="goToMembers()">Next</button>
            <div class="watermark">Sam</div>
        </div>

        <!-- Screen 2: Member Names Setup -->
        <div id="screen-members" class="screen">
            <div class="header-row">
                <button class="back-btn" onclick="showScreen('screen-welcome')">Back</button>
                <h1>gc quiz</h1>
            </div>
            <label>Baaki Members ke Naam aur Nicknames:</label>
            <div id="memberInputsContainer" class="scroll-area"></div>
            <button onclick="goToModeSelection()">Confirm Names</button>
            <div class="watermark">Sam</div>
        </div>

        <!-- Screen 3: Mode Selection -->
        <div id="screen-mode" class="screen">
            <div class="header-row">
                <button class="back-btn" onclick="showScreen('screen-members')">Back</button>
                <h1>gc quiz</h1>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
                <button onclick="startReadymadeQuiz()">Readymade Quiz</button>
                <button onclick="startCustomQuizBuilder()" style="background-color: #444444;">Create Your Own Quiz</button>
            </div>
            <div class="watermark" style="margin-top: 30px;">Sam</div>
        </div>

        <!-- Screen 4: Quiz Playing (Pass-and-Play Turn) -->
        <div id="screen-quiz" class="screen">
            <div class="header-row">
                <button class="back-btn" onclick="showScreen('screen-mode')">Back</button>
                <h3 id="questionCounter" style="font-size: 13px; font-weight: 600; color: #666;"></h3>
            </div>
            <h5 id="currentPlayerTurn" style="font-size: 13px; color: #0084ff; font-weight: 700; margin-bottom: 6px;"></h5>
            <h2 id="questionTitle" style="font-size: 15px; font-weight: 600; margin-bottom: 10px;"></h2>
            <div id="optionsContainer" class="scroll-area"></div>
            <div class="watermark">Sam</div>
        </div>

        <!-- Screen 5: Custom Quiz Builder -->
        <div id="screen-custom-builder" class="screen">
            <div class="header-row">
                <button class="back-btn" onclick="showScreen('screen-mode')">Back</button>
                <h1>gc quiz</h1>
            </div>
            <label>Apne Questions aur Options Dalo (15 Boxes):</label>
            <div id="customQuestionsContainer" class="scroll-area"></div>
            <button onclick="saveCustomQuiz()">Save & Start Quiz</button>
            <div class="watermark">Sam</div>
        </div>

        <!-- Screen 6: Scoreboard -->
        <div id="screen-score" class="screen">
            <div class="header-row">
                <h1>Scoreboard</h1>
            </div>
            <div id="scoreboardList" class="scroll-area"></div>
            <button onclick="shareLink()" style="background-color: #34c759; margin-bottom: 6px;">Share Quiz Link</button>
            <button onclick="location.reload()">Play Again</button>
            <div class="watermark">Sam</div>
        </div>
    </div>

    <script>
        let userData = {
            name: "",
            nickname: "",
            totalCount: 0,
            members: [], // {name, nickname}
            pfps: {},
            allPlayersAnswers: {}
        };

        const animalEmojis = ['🦊', '🐼', '🐨', '🐰', '🐯', '🦁', '🐶', '🐱', '🐵', '🐧', '🦄', '🐸', '🐯', '🐼', '🐨', '🐰', '🦁', '🐶', '🐱', '🐵'];

        const readymadeQuestions = [
            "Sab se bada aalsi kon hai?",
            "Sabse zada sorry kon bolta hai?",
            "Sabse zada bhookhad kon hai?",
            "Late night tak kon jagta hai?",
            "Main character energy kiske paas hai?",
            "Sabse kind kon hai?",
            "Multi-talented person kon hai?",
            "Koi bhi plan ho, sabse pehle 'Main aa raha hoon' bolke sabse late kon pahunchta hai?",
            "Bina kisi bataye achanak se offline ho jaane wala insaan kaun hai?",
            "Agar kisi ko ek ghante ke liye phone na mile, toh sabse pehle panic attack kisko aayega?",
            "Chat pe sabse zyada double texting ya spam karne wala kaun hai?",
            "Kisi serious baat par bhi achanak se hasi chhupane wala insaan kaun hai?",
            "Sabse mature kon hai?",
            "Sabse zada bakwas kon karta hai?",
            "Group mein sabse chupchap baith kar sabki baatein chupke se notice karne wala insaan kaun hai?"
        ];

        let currentQuestionIndex = 0;
        let currentPlayerIndex = 0;
        let scores = {};
        let activeQuizQuestions = [];
        let tempAnswersForCurrentPlayer = {};

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goToMembers() {
            const nameInput = document.getElementById('userName').value.trim();
            const nickInput = document.getElementById('userNickname').value.trim();
            const countInput = parseInt(document.getElementById('memberCount').value);

            if (!nameInput) {
                alert("Pehle apna naam toh likh bhai!");
                return;
            }
            if (isNaN(countInput) || countInput < 2) {
                alert("Kam se kam 2 members hone chahiye!");
                return;
            }
            if (countInput > 20) {
                alert("Maximum 20 members hi allow hain!");
                return;
            }

            userData.name = nameInput;
            userData.nickname = nickInput || nameInput;
            userData.totalCount = countInput;
            userData.members = [{ name: userData.name, nickname: userData.nickname }];

            let container = document.getElementById('memberInputsContainer');
            container.innerHTML = '';
            
            for (let i = 1; i < countInput; i++) {
                container.innerHTML += `
                    <div class="member-input-row">
                        <input type="text" class="memberNameInput" placeholder="Member ${i + 1} Real Name">
                        <input type="text" class="memberNickInput" placeholder="IG/WA Nickname">
                    </div>
                `;
            }

            showScreen('screen-members');
        }

        function goToModeSelection() {
            const nameInputs = document.querySelectorAll('.memberNameInput');
            const nickInputs = document.querySelectorAll('.memberNickInput');
            let tempMembers = [{ name: userData.name, nickname: userData.nickname }];
            let allFilled = true;
            
            for (let i = 0; i < nameInputs.length; i++) {
                let val = nameInputs[i].value.trim();
                let nickVal = nickInputs[i].value.trim();
                if (!val) {
                    allFilled = false;
                    break;
                }
                tempMembers.push({
                    name: val,
                    nickname: nickVal || val
                });
            }

            if (!allFilled) {
                alert("Saare members ke naam bharo pehle!");
                return;
            }

            userData.members = tempMembers;

            userData.members.forEach((m, index) => {
                let displayName = `${m.name} (${m.nickname})`;
                userData.pfps[displayName] = animalEmojis[index % animalEmojis.length];
            });

            showScreen('screen-mode');
        }

        function startReadymadeQuiz() {
            let memberKeys = userData.members.map(m => `${m.name} (${m.nickname})`);
            activeQuizQuestions = readymadeQuestions.map(q => ({
                question: q,
                options: memberKeys
            }));
            beginQuizSession();
        }

        function startCustomQuizBuilder() {
            let container = document.getElementById('customQuestionsContainer');
            container.innerHTML = '';

            for (let i = 1; i <= 15; i++) {
                container.innerHTML += `
                    <div class="custom-q-block">
                        <label>Q${i}. Question:</label>
                        <input type="text" class="custom-q-text" placeholder="Question ${i} likho...">
                        <label>4 Options:</label>
                        <input type="text" class="custom-opt-${i}-1" placeholder="Option 1">
                        <input type="text" class="custom-opt-${i}-2" placeholder="Option 2">
                        <input type="text" class="custom-opt-${i}-3" placeholder="Option 3">
                        <input type="text" class="custom-opt-${i}-4" placeholder="Option 4">
                    </div>
                `;
            }
            showScreen('screen-custom-builder');
        }

        function saveCustomQuiz() {
            activeQuizQuestions = [];
            for (let i = 1; i <= 15; i++) {
                let qElem = document.querySelector(`.custom-q-block:nth-child(${i}) .custom-q-text`);
                let o1Elem = document.querySelector(`.custom-opt-${i}-1`);
                let o2Elem = document.querySelector(`.custom-opt-${i}-2`);
                let o3Elem = document.querySelector(`.custom-opt-${i}-3`);
                let o4Elem = document.querySelector(`.custom-opt-${i}-4`);

                if (qElem && o1Elem && o2Elem) {
                    let qText = qElem.value.trim();
                    let o1 = o1Elem.value.trim();
                    let o2 = o2Elem.value.trim();
                    let o3 = o3Elem ? o3Elem.value.trim() : "";
                    let o4 = o4Elem ? o4Elem.value.trim() : "";

                    if (qText && o1 && o2) {
                        let opts = [o1, o2];
                        if (o3) opts.push(o3);
                        if (o4) opts.push(o4);
                        activeQuizQuestions.push({ question: qText, options: opts });
                    }
                }
            }

            if (activeQuizQuestions.length === 0) {
                alert("Kam se kam ek question aur uske 2 options toh bharo!");
                return;
            }

            beginQuizSession();
        }

        function beginQuizSession() {
            currentQuestionIndex = 0;
            currentPlayerIndex = 0;
            scores = {};
            userData.allPlayersAnswers = {};
            
            userData.members.forEach(m => {
                scores[`${m.name} (${m.nickname})`] = 0;
            });
            
            tempAnswersForCurrentPlayer = {};
            loadQuestion();
            showScreen('screen-quiz');
        }

        function loadQuestion() {
            let activeM = userData.members[currentPlayerIndex];
            let activePlayerKey = `${activeM.name} (${activeM.nickname})`;
            document.getElementById('currentPlayerTurn').innerText = `🎮 Turn: ${activeM.name} - [${activeM.nickname}]`;

            if (currentQuestionIndex >= activeQuizQuestions.length) {
                userData.allPlayersAnswers[activePlayerKey] = { ...tempAnswersForCurrentPlayer };
                
                currentPlayerIndex++;
                if (currentPlayerIndex < userData.members.length) {
                    currentQuestionIndex = 0;
                    tempAnswersForCurrentPlayer = {};
                    let nextM = userData.members[currentPlayerIndex];
                    alert(`✅ Turn Finished!\n\nAb phone ${nextM.name} (${nextM.nickname}) ko do! 📱`);
                    loadQuestion();
                    return;
                } else {
                    showScoreboard();
                    return;
                }
            }

            let currentQ = activeQuizQuestions[currentQuestionIndex];
            document.getElementById('questionCounter').innerText = `Q${currentQuestionIndex + 1}/${activeQuizQuestions.length}`;
            document.getElementById('questionTitle').innerText = currentQ.question;

            let optContainer = document.getElementById('optionsContainer');
            optContainer.innerHTML = '';

            currentQ.options.forEach(option => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="pfp-avatar">${userData.pfps[option] || '🐼'}</span> ${option}`;
                btn.onclick = function() {
                    scores[option] = (scores[option] || 0) + 1;
                    tempAnswersForCurrentPlayer[`Q${currentQuestionIndex + 1}`] = {
                        question: currentQ.question,
                        votedFor: option
                    };
                    currentQuestionIndex++;
                    loadQuestion();
                };
                optContainer.appendChild(btn);
            });
        }

        function toggleAnsDetails(id) {
            let elem = document.getElementById(id);
            if (elem.style.display === 'block') {
                elem.style.display = 'none';
            } else {
                elem.style.display = 'block';
            }
        }

        function showScoreboard() {
            showScreen('screen-score');
            let list = document.getElementById('scoreboardList');
            list.innerHTML = '';

            let sortedScores = Object.entries(scores).sort((a, b) => b[1] - a[1]);

            sortedScores.forEach(([memberKey, score], index) => {
                let pfp = userData.pfps[memberKey] || '🐼';
                let memberAnswers = userData.allPlayersAnswers[memberKey];
                
                let detailsHTML = '';
                let choicesList = '';

                // Sirf tabhi view choices dikhega jab player ne quiz complete kiya ho
                if (memberAnswers && Object.keys(memberAnswers).length > 0) {
                    detailsHTML = `<button class="view-ans-btn" onclick="toggleAnsDetails('ans-${index}')">View Choices</button>`;
                    Object.keys(memberAnswers).forEach(qKey => {
                        let item = memberAnswers[qKey];
                        choicesList += `<div><b>${item.question}</b
