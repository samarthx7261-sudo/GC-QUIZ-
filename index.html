<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gc quiz 😋</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #111111;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            position: relative;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            flex: 1;
            color: #1a1a1a;
        }
        .emoji-title {
            font-size: 22px;
            display: inline-block;
            margin-left: 4px;
        }
        .back-btn {
            background: #f0f2f5;
            color: #333333;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            width: auto;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444444;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1.5px solid #e1e4e8;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: #fafbfc;
            color: #111111;
            transition: all 0.2s;
        }
        input:focus {
            border-color: #007aff;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }
        .scroll-area {
            max-height: 40vh;
            overflow-y: auto;
            padding-right: 2px;
            margin-bottom: 10px;
        }
        .member-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .member-input-row input {
            margin-bottom: 0;
        }
        .option-btn {
            background: #f8f9fa;
            color: #1a1a1a;
            border: 1.5px solid #e9ecef;
            margin-bottom: 10px;
            text-align: left;
            font-weight: 500;
            padding: 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: #f1f3f5;
            border-color: #ced4da;
        }
        .score-card {
            background: #f8f9fa;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
        }
        .score-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
        }
        .view-ans-btn {
            background: #e7f1ff;
            color: #007aff;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
            cursor: pointer;
            width: auto;
        }
        .ans-details {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ced4da;
            font-size: 12px;
            color: #555555;
        }
        .ans-details div {
            margin-bottom: 6px;
        }
        .pfp-avatar {
            font-size: 18px;
            margin-right: 8px;
            display: inline-block;
        }
        .watermark {
            text-align: right;
            font-size: 11px;
            color: #adb5bd;
            font-weight: 500;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Screen 1: Welcome / Registration -->
        <div id="screen-welcome" class="screen active">
            <div class="header-row">
                <h1>gc quiz <span class="emoji-title">😋</span></h1>
            </div>
            <label>Apna Naam:</label>
            <input type="text" id="userName" placeholder="Pehle apna naam likho...">
            
            <label>Total GC Members Count (Max 20):</label>
            <input type="number" id="memberCount" placeholder="Jaise: 5, 10, 20..." min="2" max="20">
            
            <button onclick="goToMembers()">Next</button>
            <div class="watermark">Sam</div>
        </div>

        <!-- Screen 2: Member Names Setup -->
        <div id="screen-members" class="screen">
            <div class="header-row">
                <button class="back-btn" onclick="showScreen('screen-welcome')">Back</button>
                <h1>gc quiz</h1>
            </div>
            <label>Baaki Members ke Naam aur IG/WA Nicknames:</label>
            <div id="memberInputsContainer" class="scroll-area"></div>
            <button onclick="createOnlineRoom()">Create Online Room</button>
            <div class="watermark">Sam</div>
        </div>

        <!-- Screen 3: Waiting / Lobby -->
        <div id="screen-lobby" class="screen">
            <div class="header-row">
                <h1>Lobby ⏳</h1>
            </div>
            <p style="font-size: 13px; color: #666; margin-bottom: 12px; text-align: center;">Dosto ko link bhejo, sabke join hote hi host game start kar sakta hai!</p>
            <div id="lobbyPlayersList" class="scroll-area" style="background: #f8f9fa; padding: 10px; border-radius: 10px; border: 1px solid #e9ecef; margin-bottom: 10px;"></div>
            <button onclick="shareLink()" style="background-color: #34c759; margin-bottom: 8px;">Share Quiz Link</button>
            <button id="startHostGameBtn" onclick="hostStartQuiz()" style="display:none; background-color: #007aff;">Start Game for Everyone</button>
            <div class="watermark">Sam</div>
        </div>

        <!-- Screen 4: Quiz Playing -->
        <div id="screen-quiz" class="screen">
            <div class="header-row">
                <h3 id="questionCounter" style="font-size: 12px; font-weight: 600; color: #888888;"></h3>
            </div>
            <h2 id="questionTitle" style="font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #1a1a1a; line-height: 1.4;"></h2>
            <div id="optionsContainer" class="scroll-area"></div>
            <div class="watermark">Sam</div>
        </div>

        <!-- Screen 5: Scoreboard -->
        <div id="screen-score" class="screen">
            <div class="header-row">
                <h1>Scoreboard 🏆</h1>
            </div>
            <div id="scoreboardList" class="scroll-area"></div>
            <button onclick="location.reload()">Play Again</button>
            <div class="watermark">Sam</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdeMR-22wJYkkrA...", // Tera Firebase API Key
            authDomain: "gc-quiz-e3b4d.firebaseapp.com",
            databaseURL: "https://gc-quiz-e3b4d-default-rtdb.firebaseio.com",
            projectId: "gc-quiz-e3b4d",
            storageBucket: "gc-quiz-e3b4d.appspot.com",
            messagingSenderId: "777606359466",
            appId: "1:777606359466:web:94..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const animalEmojis = ['🦊', '🐼', '🐨', '🐰', '🐯', '🦁', '🐶', '🐱', '🐵', '🐧', '🦄', '🐸', '🐯', '🐼', '🐨', '🐰', '🦁', '🐶', '🐱', '🐵'];
        const readymadeQuestions = [
            "Sab se bada aalsi kon hai?",
            "Sabse zada sorry kon bolta hai?",
            "Sabse zada bhookhad kon hai?",
            "Late night tak kon jagta hai?",
            "Main character energy kiske paas hai?",
            "Sabse kind kon hai?",
            "Multi-talented person kon hai?",
            "Koi bhi plan ho, sabse pehle 'Main aa raha hoon' bolke sabse late kon pahunchta hai?",
            "Bina kisi bataye achanak se offline ho jaane wala insaan kaun hai?",
            "Agar kisi ko ek ghante ke liye phone na mile, toh sabse pehle panic attack kisko aayega?",
            "Chat pe sabse zyada double texting ya spam karne wala kaun hai?",
            "Kisi serious baat par bhi achanak se hasi chhupane wala insaan kaun hai?",
            "Sabse mature kon hai?",
            "Sabse zada bakwas kon karta hai?",
            "Group mein sabse chupchap baith kar sabki baatein chupke se notice karne wala insaan kaun hai?"
        ];

        let myName = "";
        let roomCode = new URLSearchParams(window.location.search).get("room");
        let isHost = false;
        let currentQIndex = 0;
        let pfps = {};
        let membersList = [];
        let mySelectedAnswers = {};

        window.showScreen = function(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        window.goToMembers = function() {
            myName = document.getElementById('userName').value.trim();
            let countInput = parseInt(document.getElementById('memberCount').value);

            if (!myName) {
                alert("Pehle apna naam toh likh bhai!");
                return;
            }
            if (isNaN(countInput) || countInput < 2) {
                alert("Kam se kam 2 members hone chahiye!");
                return;
            }

            let container = document.getElementById('memberInputsContainer');
            container.innerHTML = `
                <div style="background: #f8f9fa; padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #e9ecef;">
                    <label style="font-size: 12px; color: #007aff;">1. ${myName} (Host)</label>
                    <input type="text" id="hostNick" placeholder="Apna IG/WA Nickname (Jaise: @sam)">
                </div>
            `;
            for (let i = 1; i < countInput; i++) {
                container.innerHTML += `
                    <div style="background: #f8f9fa; padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #e9ecef;">
                        <label style="font-size: 12px; color: #666;">Member ${i + 1}</label>
                        <div class="member-input-row">
                            <input type="text" class="memberNameInput" placeholder="Real Name">
                            <input type="text" class="memberNickInput" placeholder="IG/WA Nickname">
                        </div>
                    </div>
                `;
            }
            showScreen('screen-members');
        }

        window.createOnlineRoom = function() {
            let hostNick = document.getElementById('hostNick').value.trim() || myName;
            let nameInputs = document.querySelectorAll('.memberNameInput');
            let nickInputs = document.querySelectorAll('.memberNickInput');

            membersList = [{ name: myName, nickname: hostNick }];
            for (let i = 0; i < nameInputs.length; i++) {
                if(nameInputs[i].value.trim()) {
                    membersList.push({
                        name: nameInputs[i].value.trim(),
                        nickname: nickInputs[i].value.trim() || nameInputs[i].value.trim()
                    });
                }
            }

            roomCode = 'room_' + Math.random().toString(36).substring(2, 8);
            isHost = true;
            
            let initialScores = {};
            membersList.forEach((m, idx) => {
                let key = `${m.name} (${m.nickname})`;
                initialScores[key] = 0;
                pfps[key] = animalEmojis[idx % animalEmojis.length];
            });

            set(ref(db, 'rooms/' + roomCode), {
                host: myName,
                members: membersList,
                pfps: pfps,
                scores: initialScores,
                status: 'waiting',
                currentQuestion: 0
            }).then(() => {
                window.history.pushState({}, '', `?room=${roomCode}`);
                listenToRoom();
            });
        }

        function listenToRoom() {
            showScreen('screen-lobby');
            
            onValue(ref(db, 'rooms/' + roomCode), (snapshot) => {
                let data = snapshot.val();
                if(!data) return;

                membersList = data.members;
                pfps = data.pfps || {};

                let list = document.getElementById('lobbyPlayersList');
                list.innerHTML = '<b style="font-size: 13px; color: #444;">Connected Players:</b><br><br>';
                membersList.forEach((m, idx) => {
                    let key = `${m.name} (${m.nickname})`;
                    let p = pfps[key] || animalEmojis[idx % animalEmojis.length];
                    list.innerHTML += `<div style="margin-bottom: 6px; font-size: 14px;">${p} <b>${m.name}</b> (${m.nickname})</div>`;
                });

                if (data.status === 'playing') {
                    startQuizSession(data);
                } else if (data.status === 'finished') {
                    showScoreboard(data);
                }

                if (isHost && data.status === 'waiting') {
                    document.getElementById('startHostGameBtn').style.display = 'block';
                }
            });
        }

        window.hostStartQuiz = function() {
            update(ref(db, 'rooms/' + roomCode), {
                status: 'playing',
                currentQuestion: 0
            });
        }

        function startQuizSession(data) {
            showScreen('screen-quiz');
            currentQIndex = data.currentQuestion || 0;

            if (currentQIndex >= readymadeQuestions.length) {
                if (isHost) {
                    update(ref(db, 'rooms/' + roomCode), { status: 'finished' });
                }
                return;
            }

            let qText = readymadeQuestions[currentQIndex];
            document.getElementById('questionCounter').innerText = `Q${currentQIndex + 1}/${readymadeQuestions.length}`;
            document.getElementById('questionTitle').innerText = qText;

            let optContainer = document.getElementById('optionsContainer');
            optContainer.innerHTML = '';

            membersList.forEach(m => {
                let optionKey = `${m.name} (${m.nickname})`;
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="pfp-avatar">${pfps[optionKey] || '🐼'}</span> ${optionKey}`;
                btn.onclick = function() {
                    get(ref(db, `rooms/${roomCode}/scores/${optionKey}`)).then((snapshot) => {
                        let currentScore = snapshot.val() || 0;
                        let updates = {};
                        updates[`scores/${optionKey}`] = currentScore + 1;
                        updates[`currentQuestion`] = currentQIndex + 1;
                        update(ref(db, 'rooms/' + roomCode), updates);
                    });
                };
                optContainer.appendChild(btn);
            });
        }

        function showScoreboard(data) {
            showScreen('screen-score');
            let list = document.getElementById('scoreboardList');
            list.innerHTML = '';

            let scores = data.scores || {};
            let sortedScores = Object.entries(scores).sort((a, b) => b[1] - a[1]);

            sortedScores.forEach(([memberKey, score], index) => {
                let p = pfps[memberKey] || '🐼';
                list.innerHTML += `
                    <div class="score-card">
                        <div class="score-header">
                            <div>
                                <span class="pfp-avatar">${p}</span>
                                <span>#${index + 1} ${memberKey}</span>
                            </div>
                            <span style="font-weight: 600; color: #007aff;">${score} votes</span>
                        </div>
                    </div>
                `;
            });
        }

        window.shareLink = function() {
            let shareUrl = window.location.href;
            if (navigator.share) {
                navigator.share({ title: 'gc quiz', text: 'gc quiz 😋', url: shareUrl }).catch(() => {});
            } else {
                prompt("gc quiz link copy kar lo:", shareUrl);
            }
        }

        // Agar URL mein room code hai toh direct lobby mein join karega
        if(roomCode) {
            get(ref(db, 'rooms/' + roomCode)).then((snapshot) => {
                if(snapshot.exists()) {
                    let data = snapshot.val();
                    membersList = data.members;
                    pfps = data.pfps || {};
                    listenToRoom();
                } else {
                    alert("Room nahi mila ya expire ho gaya!");
                }
            });
        }
    </script>
</body>
</html>
