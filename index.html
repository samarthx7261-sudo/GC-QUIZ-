<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gc quiz 😋</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #111111;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            position: relative;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            flex: 1;
            color: #1a1a1a;
        }
        .emoji-title {
            font-size: 22px;
            display: inline-block;
            margin-left: 4px;
        }
        .back-btn {
            background: #f0f2f5;
            color: #333333;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            width: auto;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444444;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1.5px solid #e1e4e8;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: #fafbfc;
            color: #111111;
            transition: all 0.2s;
        }
        input:focus {
            border-color: #007aff;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }
        .scroll-area {
            max-height: 40vh;
            overflow-y: auto;
            padding-right: 2px;
            margin-bottom: 10px;
        }
        .member-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .member-input-row input {
            margin-bottom: 0;
        }
        .option-btn {
            background: #f8f9fa;
            color: #1a1a1a;
            border: 1.5px solid #e9ecef;
            margin-bottom: 10px;
            text-align: left;
            font-weight: 500;
            padding: 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: #f1f3f5;
            border-color: #ced4da;
        }
        .score-card {
            background: #f8f9fa;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
        }
        .score-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
        }
        .ans-list-item {
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #e9ecef;
            font-size: 13px;
        }
        .pfp-avatar {
            font-size: 18px;
            margin-right: 8px;
            display: inline-block;
        }
        .watermark {
            text-align: right;
            font-size: 11px;
            color: #adb5bd;
            font-weight: 500;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Screen 1: Welcome / Registration -->
        <div id="screen-welcome" class="screen active">
            <div class="header-row">
                <h1>gc quiz <span class="emoji-title">😋</span></h1>
            </div>
            <label>Apna Naam:</label>
            <input type="text" id="userName" placeholder="Pehle apna naam likho...">
            
            <label>Total GC Members Count (Max 20):</label>
            <input type="number" id="memberCount" placeholder="Jaise: 5, 10, 20..." min="2" max="20">
            
            <button onclick="goToMembers()">Next</button>
            <div class="watermark">Sam</div>
        </div>

        <!-- Screen 2: Member Nicknames Setup -->
        <div id="screen-members" class="screen">
            <div class="header-row">
                <button class="back-btn" onclick="showScreen('screen-welcome')">Back</button>
                <h1>gc quiz</h1>
            </div>
            <label>Baaki Members ke Nicknames (Options ke liye):</label>
            <div id="memberInputsContainer" class="scroll-area"></div>
            <button onclick="startQuiz()">Start Quiz</button>
            <div class="watermark">Sam</div>
        </div>

        <!-- Screen 3: Quiz Playing -->
        <div id="screen-quiz" class="screen">
            <div class="header-row">
                <h3 id="questionCounter" style="font-size: 12px; font-weight: 600; color: #888888;"></h3>
            </div>
            <h2 id="questionTitle" style="font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #1a1a1a; line-height: 1.4;"></h2>
            <div id="optionsContainer" class="scroll-area"></div>
            <div class="watermark">Sam</div>
        </div>

        <!-- Screen 4: Scoreboard / Result -->
        <div id="screen-score" class="screen">
            <div class="header-row">
                <h1>Your Results 🏆</h1>
            </div>
            <p style="font-size: 13px; color: #666; margin-bottom: 10px;">Tune kis question ka kya answer diya:</p>
            <div id="scoreboardList" class="scroll-area"></div>
            <button onclick="location.reload()" style="margin-top: 8px;">Play Again</button>
            <div class="watermark">Sam</div>
        </div>
    </div>

    <script>
        const animalEmojis = ['🦊', '🐼', '🐨', '🐰', '🐯', '🦁', '🐶', '🐱', '🐵', '🐧', '🦄', '🐸', '🐯', '🐼', '🐨', '🐰', '🦁', '🐶', '🐱', '🐵'];
        
        const readymadeQuestions = [
            "Sab se bada aalsi kon hai?",
            "Sabse zada sorry kon bolta hai?",
            "Sabse zada bhookhad kon hai?",
            "Late night tak kon jagta hai?",
            "Main character energy kiske paas hai?",
            "Sabse kind kon hai?",
            "Multi-talented person kon hai?",
            "Koi bhi plan ho, sabse pehle 'Main aa raha hoon' bolke sabse late kon pahunchta hai?",
            "Bina kisi bataye achanak se offline ho jaane wala insaan kaun hai?",
            "Agar kisi ko ek ghante ke liye phone na mile, toh sabse pehle panic attack kisko aayega?",
            "Chat pe sabse zyada double texting ya spam karne wala kaun hai?",
            "Kisi serious baat par bhi achanak se hasi chhupane wala insaan kaun hai?",
            "Sabse mature kon hai?",
            "Sabse zada bakwas kon karta hai?",
            "Group mein sabse chupchap baith kar sabki baatein chupke se notice karne wala insaan kaun hai?"
        ];

        let myName = "";
        let membersList = [];
        let pfps = {};
        let currentQIndex = 0;
        let userAnswers = [];

        window.showScreen = function(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        window.goToMembers = function() {
            myName = document.getElementById('userName').value.trim();
            let countInput = parseInt(document.getElementById('memberCount').value);

            if (!myName) {
                alert("Pehle apna naam toh likh bhai!");
                return;
            }
            if (isNaN(countInput) || countInput < 2) {
                alert("Kam se kam 2 members hone chahiye!");
                return;
            }
            if (countInput > 20) {
                alert("Maximum 20 members allow hain!");
                return;
            }

            let container = document.getElementById('memberInputsContainer');
            container.innerHTML = '';

            for (let i = 0; i < countInput; i++) {
                container.innerHTML += `
                    <div style="background: #f8f9fa; padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #e9ecef;">
                        <label style="font-size: 12px; color: #666;">Member ${i + 1} Nickname</label>
                        <input type="text" class="memberNickInput" placeholder="Jaise: @sam, @aman, etc.">
                    </div>
                `;
            }
            showScreen('screen-members');
        }

        window.startQuiz = function() {
            let nickInputs = document.querySelectorAll('.memberNickInput');
            membersList = [];

            let allFilled = true;
            nickInputs.forEach((inp, idx) => {
                let val = inp.value.trim();
                if (!val) {
                    allFilled = false;
                } else {
                    membersList.push(val);
                    pfps[val] = animalEmojis[idx % animalEmojis.length];
                }
            });

            if (!allFilled) {
                alert("Sabhi members ke nicknames bharo!");
                return;
            }

            currentQIndex = 0;
            userAnswers = [];
            loadQuestion();
            showScreen('screen-quiz');
        }

        function loadQuestion() {
            if (currentQIndex >= readymadeQuestions.length) {
                showResults();
                return;
            }

            let qText = readymadeQuestions[currentQIndex];
            document.getElementById('questionCounter').innerText = `Q${currentQIndex + 1}/${readymadeQuestions.length}`;
            document.getElementById('questionTitle').innerText = qText;

            let optContainer = document.getElementById('optionsContainer');
            optContainer.innerHTML = '';

            membersList.forEach(nick => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="pfp-avatar">${pfps[nick] || '🐼'}</span> ${nick}`;
                btn.onclick = function() {
                    userAnswers.push({
                        question: qText,
                        selected: nick
                    });
                    currentQIndex++;
                    loadQuestion();
                };
                optContainer.appendChild(btn);
            });
        }

        function showResults() {
            showScreen('screen-score');
            let list = document.getElementById('scoreboardList');
            list.innerHTML = '';

            userAnswers.forEach((item, idx) => {
                let p = pfps[item.selected] || '🐼';
                list.innerHTML += `
                    <div class="ans-list-item">
                        <div style="font-weight: 600; color: #1a1a1a; margin-bottom: 4px;">Q${idx + 1}. ${item.question}</div>
                        <div style="color: #007aff;">Ans: <span class="pfp-avatar">${p}</span><b>${item.selected}</b></div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
